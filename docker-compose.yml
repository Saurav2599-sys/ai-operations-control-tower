services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops_tower
      POSTGRES_PASSWORD: ops_tower
      POSTGRES_DB: ops_tower
    ports:
      - "5432:5432"
    volumes:
      - ops_tower_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_tower"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ops_tower_pgdata:
